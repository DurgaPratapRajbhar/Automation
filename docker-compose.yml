services:
   postgres:
     image: pgvector/pgvector:pg17
     container_name: automation-postgres
     restart: unless-stopped
     environment: 
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: "123"
        POSTGRES_DB: automation
     ports : 
       - "5432:5432"   

     volumes:
        - postgres_data:/var/lib/postgresql/data

   redis:
      image: redis:7-alpine
      container_name: automation-redis
      restart: unless-stopped
      ports:
        - "6379:6379"
      volumes:
        - redis_data:/data    
   
   backend:
      build:
        context: ./backend
        dockerfile: Dockerfile
      container_name: automation-backend
      restart: unless-stopped
      working_dir: /var/www/html
      volumes:
      - ./backend:/var/www/html
      ports:
        - "8000:8000"
      depends_on:
        - postgres
        - redis
      env_file:
        - ./backend/.env
      environment:
        # artisan serve runs 4 PHP workers, so one slow request does not block the rest
        PHP_CLI_SERVER_WORKERS: "4"

   frontend:
      build:
        context: ./frontend
      container_name: automation-frontend
      restart: unless-stopped
      working_dir: /app
      volumes:
        - ./frontend:/app
        # Keep these inside the container (fast, and no clash with files on Windows)
        - /app/node_modules
        - /app/.next
      ports:
        - "3000:3000"
      environment:
        BACKEND_URL: http://backend:8000
        # File watching on a Windows bind mount
        WATCHPACK_POLLING: "true"
        NEXT_TELEMETRY_DISABLED: "1"
        # Public test domain (ngrok) for the Meta popup + webhook
        ALLOWED_DEV_ORIGINS: vaporizer-parrot-sapling.ngrok-free.dev
      depends_on:
        - backend

   ai-service:
      build:
        context: ./ai-service
      container_name: automation-ai
      restart: unless-stopped
      working_dir: /app
      volumes:
        - ./ai-service:/app
      ports:
        - "8001:8001"
      env_file:
        - ./ai-service/.env
      # Container host (aapke PC) ko is naam se dhundhta hai -> Ollama tak pahunch
      extra_hosts:
        - "host.docker.internal:host-gateway"
      # Dev me file badalte hi reload
      command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
      depends_on:
        - postgres

volumes:
  postgres_data:
  redis_data:
  

