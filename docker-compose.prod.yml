# Production (server). Local development keeps using docker-compose.yml.
# Only the frontend joins the shared "web" network, where the server's Caddy sends app.scriptdp.com.
name: scriptdp

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: automation
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: scriptdp-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    command: sh -c "php artisan config:cache && php artisan route:cache && php-fpm"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      - postgres

  # nginx in front of php-fpm
  backend-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

  # AI replies and other queued jobs
  queue:
    image: scriptdp-backend
    restart: unless-stopped
    user: www-data
    env_file:
      - ./backend/.env
    command: sh -c "php artisan config:cache && php artisan queue:work --tries=3 --timeout=120"
    volumes:
      - backend_storage:/var/www/html/storage
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        BACKEND_URL: http://backend-web
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend-web
    depends_on:
      - backend-web
    networks:
      default:
      # Unique name on the shared network (other projects also have a "frontend")
      web:
        aliases:
          - app-frontend

  ai-service:
    build:
      context: ./ai-service
    restart: unless-stopped
    env_file:
      - ./ai-service/.env
    depends_on:
      - postgres

volumes:
  postgres_data:
  backend_storage:

networks:
  web:
    external: true
