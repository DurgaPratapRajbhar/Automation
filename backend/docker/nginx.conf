# API only: every request goes to Laravel's front controller in the backend (php-fpm) container
server {
    listen 80;
    client_max_body_size 25m;

    # Ask Docker's DNS again every 10s: a redeployed backend gets a new IP, and a fixed
    # upstream would keep the old one (502 "Server error" until nginx restarts)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream backend:9000;

    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_pass $php_upstream;
        fastcgi_read_timeout 120s;
    }
}
